# Experiment configuration for crop price forecasting research.

paths:
  raw: "data/raw"
  processed: "data/processed"
  external: "data/external"
  artifacts: "artifacts"

forecast:
  # Forecast horizon in calendar days. The panel is daily, so this is 60 rows per crop.
  horizon: 60
  # Encoder length (look-back) in calendar days fed to each forecast.
  window_size: 90
  quantiles: [0.1, 0.5, 0.9]
  # Days between consecutive forecast origins when cutting sliding windows.
  origin_step: 1
  # Splits whose windows get forecasts written to artifacts/forecasts/.
  predict_splits: ["validation", "test"]

splits:
  # Chronological split ratios (must sum to 1.0).
  train: 0.70
  validation: 0.15
  test: 0.15

random_seed: 42

# Observed-data panel built by src/features/build_dataset.py. See docs/dataset.md.
dataset:
  sources:
    cbsl_prices: "Data.xls"
    wfp_prices: "wfp_food_prices_lka.csv"
    weather_daily: "sources/weather_daily.csv"
    dekadal_rainfall: "lka-rainfall-subnat-full.csv"
    fuel_revisions: "sources/fuel_revisions_cpc.csv"
    fuel_daily_check: "sources/fuel_daily.csv"
    usd_lkr_daily: "sources/usd_lkr_daily.csv"
  target:
    source: "CBSL"
    market: "Dambulla"
    price_type: "wholesale"
    crops: ["beans", "cabbage", "carrot"]
    # Independent market used to confirm or reject large one-day price jumps.
    corroborating_market: "Pettah"
  wfp_commodities:
    "Beans": "beans"
    "Cabbage": "cabbage"
    "Carrots": "carrot"
    "Potatoes (local)": "potato"
  districts:
    nuwara_eliya: "LK23"
    badulla: "LK81"
  covariate_start: "2018-01-01"
  covariate_end: "2025-12-31"
  # Calendar-day lags of the last quoted price.
  price_lags: [1, 7, 14, 30, 60]
  # Price rolling stats over the previous N quotes (trading days), excluding the current day.
  price_rolling_quotes: [5, 22]
  # Rainfall rolling sums over previous calendar days, excluding the current day.
  rainfall_rolling_windows: [7, 30]
  anomaly_mad_z: 6.0

# Column roles used by both models (src/features/prepare_model_data.py).
features:
  target: "price_lkr_per_kg"
  # Last quote carried over closed days. Model input only; never scored.
  target_filled: "price_ffill"
  # 1 where the target was actually quoted. Scoring mask and loss weight.
  observed_flag: "price_observed"
  group: "crop"
  time_idx: "time_idx"
  static_categoricals: ["crop"]
  known_categoricals: ["season"]
  known_reals: ["month_sin", "month_cos", "day_of_week", "day_of_year"]
  known_flags: ["market_open"]
  observed_reals:
    - "price_lag_1"
    - "price_lag_7"
    - "price_lag_14"
    - "price_lag_30"
    - "price_lag_60"
    - "price_roll_mean_5q"
    - "price_roll_std_5q"
    - "price_roll_mean_22q"
    - "price_roll_std_22q"
    - "diesel_lkr_per_litre"
    - "petrol92_lkr_per_litre"
    - "usd_lkr"
    - "nuwara_eliya_rainfall_mm"
    - "badulla_rainfall_mm"
    - "nuwara_eliya_tmean_c"
    - "badulla_tmean_c"
    - "nuwara_eliya_et0_mm"
    - "badulla_et0_mm"
    - "nuwara_eliya_rainfall_roll_sum_30"
    - "badulla_rainfall_roll_sum_30"
    - "nuwara_eliya_rain_dekad_anomaly_pct"
    - "badulla_rain_dekad_anomaly_pct"
  observed_flags: ["price_is_carried_forward", "fuel_revision_day", "usd_lkr_carried_forward"]
  # Applied to known_reals and observed_reals, fitted on training rows only. Flags and target stay raw.
  scaling: "minmax"

sarimax:
  # One model per crop on the daily calendar; closed-market days are missing endog.
  seasonal_period: 7
  # Model log price, so intervals are log-normal and stay positive.
  log_target: true
  order_grid:
    p: [0, 1, 2]
    # Picked by an ADF test on training quotes, not by AIC.
    d: [0, 1]
    q: [0, 1]
  seasonal_order_grid:
    P: [0, 1]
    D: [0]
    Q: [0, 1]
  stationarity_alpha: 0.05
  information_criterion: "aic"
  fit_maxiter: 200
  # Observed covariates shifted by the horizon so every value is known at the forecast origin.
  exog:
    - "diesel_lkr_per_litre"
    - "usd_lkr"
    - "nuwara_eliya_rainfall_roll_sum_30"
    - "badulla_rainfall_roll_sum_30"
    - "nuwara_eliya_tmean_c"
    - "badulla_tmean_c"
  exog_lag_days: 60

tft:
  hidden_size: 16
  attention_head_size: 1
  hidden_continuous_size: 8
  lstm_layers: 1
  dropout: 0.1
  # Per-crop target normalizer; quantile loss is still computed in LKR/kg.
  target_transformation: "log"
  reduce_on_plateau_patience: 3
  learning_rate: 0.01
  batch_size: 64
  max_epochs: 30
  early_stopping_patience: 5
  gradient_clip_val: 0.1
